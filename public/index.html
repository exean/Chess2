<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1d23" />
  <title>Chess2 - Online Schach</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chess2" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-lobby">
  <header class="topbar">
    <a href="/" class="brand">Chess2</a>
    <div class="topbar-spacer"></div>
    <select id="pieces-select" class="pieces-select" title="Figurenstil" aria-label="Figurenstil"></select>
    <div id="auth-area" class="auth-area">
      <button id="btn-show-login" class="btn btn-ghost">Login</button>
      <button id="btn-show-register" class="btn btn-ghost">Account erstellen</button>
    </div>
  </header>

  <main class="lobby">
    <section class="card hero">
      <h1>Online Schach mit Freunden</h1>
      <p class="muted">Spiele live auf jedem Gerät. Erstelle einen Raum und teile den Code, oder tritt einer offenen Partie bei.</p>
      <label for="nickname">Dein Nickname</label>
      <input id="nickname" type="text" maxlength="32" placeholder="z.B. Bauer42" autocomplete="nickname" />
      <p id="logged-in-as" class="muted hidden"></p>
    </section>

    <section class="card">
      <h2>Neuen Raum erstellen</h2>
      <div class="row">
        <label>Gegner
          <select id="opponent">
            <option value="human" selected>Andere Person</option>
            <option value="bot-easy">Computer (leicht)</option>
            <option value="bot-medium">Computer (mittel)</option>
            <option value="bot-hard">Computer (schwer)</option>
          </select>
        </label>
        <label>Farbe
          <select id="seat">
            <option value="random" selected>Zufällig</option>
            <option value="w">Weiß</option>
            <option value="b">Schwarz</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Brettform
          <select id="shape">
            <option value="standard" selected>Standard 8x8</option>
            <option value="octagon">Achteck 10x10</option>
            <option value="cross">Kreuz 12x12</option>
            <option value="custom">Benutzerdefiniert</option>
          </select>
        </label>
      </div>
      <div class="row hidden" id="custom-size">
        <label>Spalten (min 8)
          <input type="number" id="custom-w" min="8" max="26" step="1" value="8" inputmode="numeric" />
        </label>
        <label>Reihen (min 4)
          <input type="number" id="custom-h" min="4" max="20" step="1" value="8" inputmode="numeric" />
        </label>
      </div>
      <div class="row">
        <label>Zeit (Minuten)
          <select id="tc-initial">
            <option value="0">Ohne Uhr</option>
            <option value="1">1 (Bullet)</option>
            <option value="3" selected>3 (Blitz)</option>
            <option value="5">5</option>
            <option value="10">10 (Rapid)</option>
            <option value="15">15</option>
            <option value="30">30</option>
          </select>
        </label>
        <label>Inkrement (Sek.)
          <select id="tc-increment">
            <option value="0">0</option>
            <option value="2" selected>2</option>
            <option value="5">5</option>
            <option value="10">10</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Sichtbarkeit
          <select id="visibility">
            <option value="private" selected>Privat (Code)</option>
            <option value="public">Öffentlich</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="rated" /> Bewertet (nur Standard + Account)
        </label>
      </div>
      <p class="muted shape-hint" id="shape-hint"></p>
      <button id="btn-create" class="btn btn-primary">Raum erstellen</button>
    </section>

    <section class="card">
      <h2>Raum beitreten</h2>
      <div class="row">
        <input id="join-code" type="text" maxlength="6" placeholder="Code (z.B. AB3D9)" inputmode="text" autocapitalize="characters" />
        <button id="btn-join" class="btn btn-primary">Beitreten</button>
      </div>
    </section>

    <section class="card">
      <h2>Offene Partien</h2>
      <ul id="public-list" class="list"><li class="muted">Lade...</li></ul>
      <button id="btn-refresh" class="btn btn-ghost">Aktualisieren</button>
    </section>

    <section class="card">
      <h2>Bestenliste</h2>
      <ol id="leaderboard" class="list"><li class="muted">Lade...</li></ol>
    </section>
  </main>

  <div id="auth-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <button class="modal-close" data-close>×</button>
      <h2 id="auth-title">Login</h2>
      <form id="auth-form">
        <label>Username
          <input type="text" name="username" maxlength="32" required autocomplete="username" />
        </label>
        <label>Passwort
          <input type="password" name="password" minlength="6" required autocomplete="current-password" />
        </label>
        <p id="auth-error" class="error hidden"></p>
        <button type="submit" class="btn btn-primary">OK</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pieces.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/lobby.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
