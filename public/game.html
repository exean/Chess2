<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1d23" />
  <title>Chess2 - Partie</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chess2" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-game">
  <header class="topbar">
    <a href="/" class="brand">Chess2</a>
    <div id="room-info" class="room-info"></div>
    <select id="pieces-select" class="pieces-select" title="Figurenstil" aria-label="Figurenstil"></select>
    <button id="btn-flip" class="btn btn-ghost" title="Brett drehen">↻</button>
  </header>

  <main class="game">
    <section class="board-panel">
      <div id="share-panel" class="share-panel hidden">
        <h3>Mitspieler einladen</h3>
        <p class="muted">Code teilen oder QR-Code scannen lassen:</p>
        <div class="share-row">
          <div class="share-code" id="share-code">—</div>
          <img id="share-qr" class="share-qr" alt="QR-Code zum Beitreten" />
        </div>
        <div class="share-link-row">
          <input id="share-url" type="text" readonly />
          <button id="btn-copy" class="btn btn-ghost" type="button">Kopieren</button>
          <button id="btn-share" class="btn btn-primary hidden" type="button">Teilen</button>
        </div>
      </div>

      <div id="player-top" class="player-card">
        <span class="player-name">…</span>
        <span class="player-rating"></span>
        <span class="player-clock" data-clock="top">--:--</span>
      </div>
      <div id="board" class="board" role="grid" aria-label="Schachbrett"></div>
      <div id="player-bottom" class="player-card">
        <span class="player-name">…</span>
        <span class="player-rating"></span>
        <span class="player-clock" data-clock="bottom">--:--</span>
      </div>
      <div class="game-actions">
        <button id="btn-resign" class="btn btn-danger" disabled>Aufgeben</button>
        <button id="btn-draw" class="btn btn-ghost" disabled>Remis anbieten</button>
        <button id="btn-rematch" class="btn btn-primary hidden">Revanche</button>
        <button id="btn-review" class="btn btn-ghost hidden">Partie ansehen</button>
        <button id="btn-leave" class="btn btn-ghost">Verlassen</button>
      </div>
      <div class="review-bar hidden" id="review-bar">
        <button id="btn-rv-start" class="btn btn-ghost" title="Anfang">⏮</button>
        <button id="btn-rv-prev"  class="btn btn-ghost" title="Zurück (◀)">◀</button>
        <span id="review-status" class="muted">0 / 0</span>
        <button id="btn-rv-next"  class="btn btn-ghost" title="Vor (▶)">▶</button>
        <button id="btn-rv-end"   class="btn btn-ghost" title="Ende">⏭</button>
        <button id="btn-rv-exit"  class="btn btn-ghost" title="Review schließen">✕</button>
      </div>
      <div class="voice-bar" id="voice-bar">
        <button id="btn-voice" class="btn btn-ghost" title="Sprachchat ein-/ausschalten" disabled>🎙️ Stimme</button>
        <button id="btn-mute" class="btn btn-ghost hidden" title="Mikrofon stumm schalten">🔇 Stumm</button>
        <span id="voice-status" class="voice-status muted"></span>
      </div>
      <div class="voice-bar hidden" id="chessnut-bar">
        <button id="btn-chessnut" class="btn btn-ghost" title="Chessnut Brett per Bluetooth verbinden">♟ Chessnut</button>
        <button id="btn-chessnut-flip" class="btn btn-ghost hidden" title="Brett-Orientierung umkehren">↻</button>
        <span id="chessnut-status" class="voice-status muted"></span>
      </div>
      <p id="status-line" class="status muted"></p>
    </section>

    <aside class="side-panel">
      <div class="moves card">
        <h3>Züge</h3>
        <ol id="move-list" class="move-list"></ol>
      </div>
      <div class="chat card">
        <h3>Chat</h3>
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text" maxlength="500" placeholder="Nachricht..." autocomplete="off" />
          <button class="btn btn-primary" type="submit">Senden</button>
        </form>
      </div>
    </aside>
  </main>

  <div id="name-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <h2>Wie heißt du?</h2>
      <p class="muted">Damit dein Gegner weiß, wer am Zug ist.</p>
      <form id="name-form">
        <label>Nickname
          <input type="text" name="nickname" maxlength="32" required autofocus />
        </label>
        <button type="submit" class="btn btn-primary">Beitreten</button>
      </form>
    </div>
  </div>

  <div id="promo-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content small">
      <h3>Bauernumwandlung</h3>
      <div class="promo-choices">
        <button class="promo-btn" data-promo="q"></button>
        <button class="promo-btn" data-promo="r"></button>
        <button class="promo-btn" data-promo="b"></button>
        <button class="promo-btn" data-promo="n"></button>
      </div>
    </div>
  </div>

  <div id="end-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <h2 id="end-title">Partie beendet</h2>
      <p id="end-detail"></p>
      <div class="row">
        <button id="end-rematch" class="btn btn-primary">Revanche</button>
        <button id="end-review"  class="btn btn-ghost">Partie ansehen</button>
        <button id="end-leave"   class="btn btn-ghost">Verlassen</button>
      </div>
      <details>
        <summary>PGN</summary>
        <pre id="end-pgn" class="pgn"></pre>
      </details>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/lib/chess-engine.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pieces.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/board.js"></script>
  <script src="/js/voice.js"></script>
  <script src="/js/chessnut.js"></script>
  <script src="/js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
